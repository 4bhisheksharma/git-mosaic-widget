name: widgets
description: "GitMosaic - Beautiful GitHub contribution graph widgets for your home screen."
publish_to: 'none'
version: 0.1.1+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  home_widget: ^0.9.4
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0D1117"
  adaptive_icon_foreground: "assets/icons/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
